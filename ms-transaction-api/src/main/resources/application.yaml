spring:
  application:
    name: ms-transaction-api
  datasource:
    url: jdbc:h2:mem:transactiondb;INIT=RUNSCRIPT FROM 'classpath:/sql/init_my_db.sql'
    driver-class-name: org.h2.Driver
    username: sa
    password:
    h2:
      console:
        enabled: true
    jpa:
      show-sql: true
      database-platform: org.hibernate.dialect.H2Dialect
      hibernate:
        ddl-auto: create-drop
logging:
  level:
    root: INFO
    com.transaction.api: DEBUG
    org.springframework.web: DEBUG
    org.springframework.jdbc: DEBUG
    org.h2.database: DEBUG
    org.springframework.boot.web: INFO